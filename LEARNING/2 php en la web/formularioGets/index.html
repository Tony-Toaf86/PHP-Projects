<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión</title>
<style>
  /* Reset básico */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    padding: 20px;
  }

  .form-container {
    background: white;
    border-radius: 12px;
    padding: 40px 30px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .form-container .title {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    color: #333;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 20px;
  }

  .input-group label {
    margin-bottom: 5px;
    font-weight: bold;
    color: #555;
  }

  .input-group input {
    padding: 12px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: all 0.3s;
  }

  .input-group input:focus {
    border-color: #2575fc;
    outline: none;
    box-shadow: 0 0 5px rgba(37,117,252,0.5);
  }

  .forgot {
    margin-top: 5px;
    font-size: 12px;
    text-align: right;
  }

  .forgot a {
    text-decoration: none;
    color: #2575fc;
    transition: 0.3s;
  }

  .forgot a:hover {
    text-decoration: underline;
  }

  .sign {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background-color: #2575fc;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  .sign:hover {
    background-color: #1a5ed1;
  }

  .social-message {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px 0;
    font-size: 14px;
    color: #555;
  }

  .social-message .line {
    flex: 1;
    height: 1px;
    background-color: #ccc;
    margin: 0 10px;
  }

  .social-icons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
  }

  .social-icons .icon {
    border: 1px solid #ccc;
    padding: 10px;
    border-radius: 50%;
    cursor: pointer;
    background-color: white;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .social-icons .icon:hover {
    transform: scale(1.1);
    border-color: #2575fc;
  }

  .signup {
    text-align: center;
    font-size: 14px;
    color: #555;
  }

  .signup a {
    color: #2575fc;
    text-decoration: none;
    font-weight: bold;
  }

  .signup a:hover {
    text-decoration: underline;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .form-container {
      padding: 30px 20px;
    }

    .input-group input {
      font-size: 13px;
      padding: 10px 8px;
    }

    .sign {
      font-size: 14px;
      padding: 10px;
    }
  }
</style>
</head>
<body>

<div class="form-container">
  <p class="title">Iniciar Sesión</p>
  <form class="form" method="get" action="login.php">
    <div class="input-group">
      <label for="username">Usuario</label>
      <input type="text" name="usuario" id="username" placeholder="Ingrese su usuario" required>
    </div>
    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" name="contrasena" id="password" placeholder="Ingrese su contraseña" required>
      <div class="forgot">
        <a href="VIEW/LOST-PASSWORD/index.html">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="forgot">
        <a href="usuarios/create/index.html">Registrar nuevo usuario</a>
      </div>
    </div>
    <button class="sign" type="submit">Iniciar Sesión</button>
  </form>

  <div class="social-message">
    <div class="line"></div>
    <p class="message">O inicia con redes sociales</p>
    <div class="line"></div>
  </div>
